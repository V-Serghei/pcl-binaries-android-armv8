plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'io.github.vserghei.pcl.sample'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.vserghei.pcl.sample'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}

dependencies {
    implementation project(':pclibrary')
}
