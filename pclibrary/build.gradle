import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.jetbrains.kotlin.android)
    id("maven-publish")
    id("signing")
}

def nativeRoot = file('src/main/cpp/pclib/jniLibs/arm64-v8a')
def pclLibDir = file("${nativeRoot}/pcl/lib")
def prefabHeadersDir = layout.buildDirectory.dir("generated/prefabHeaders")
def pclArchives = [
        'libpcl_tracking.zip',
        'libpcl_surface.zip',
        'libpcl_common.zip',
        'libpcl_features.zip',
        'libpcl_filters.zip',
        'libpcl_io.zip',
        'libpcl_io_ply.zip',
        'libpcl_kdtree.zip',
        'libpcl_keypoints.zip',
        'libpcl_ml.zip',
        'libpcl_octree.zip',
        'libpcl_recognition.zip',
        'libpcl_registration.zip',
        'libpcl_sample_consensus.zip',
        'libpcl_search.zip',
        'libpcl_segmentation.zip',
        'libpcl_stereo.zip'
]

tasks.register('mergeArchiveParts') {
    doLast {
        pclArchives.each { archiveName ->
            def outputFile = file("${pclLibDir}/${archiveName}")

            def partsPattern = "${archiveName}.*"
            def parts = fileTree(dir: pclLibDir, includes: [partsPattern]).files.sort { it.name }

            if (!parts.empty) {
                println "Merging parts for ${archiveName}..."

                if (!outputFile.exists()) {
                    outputFile.withOutputStream { outputStream ->
                        parts.each { part ->
                            outputStream.write(part.bytes)
                            println "Added: ${part.name}"
                        }
                    }

                    println "Merge completed, file: $outputFile"
                } else {
                    println "File ${archiveName} already exists, skipping merge."
                }
            } else {
                println "Not all parts for ${archiveName} are available, skipping merge."
            }
        }
    }
}


tasks.register('extractArchives') {
    doLast {
        pclArchives.each { archiveName ->
            def archiveFile = file("${pclLibDir}/${archiveName}")

            if (archiveFile.exists()) {
                if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                    exec {
                        commandLine 'powershell', '-command', "& {Expand-Archive -Path '${archiveFile}' -DestinationPath '${pclLibDir}' -Force}"
                    }
                } else {
                    exec {
                        commandLine 'bash', '-c', "unzip -o '${archiveFile}' -d '${pclLibDir}'"
                    }
                }

                println "Archive ${archiveName} successfully unpacked!"
            } else {
                println "Archive ${archiveName} does not exist, skipping extraction."
            }
        }
    }
}

extractArchives.dependsOn mergeArchiveParts

tasks.register('preparePrefabHeaders', Sync) {
    from("${nativeRoot}/pcl/include")
    from("${nativeRoot}/boost/include")
    from("${nativeRoot}/eigen/include/eigen3")
    from("${nativeRoot}/flann/include")
    from("${nativeRoot}/lz4/include")
    into(prefabHeadersDir)
}

tasks.register('emptyJavadocJar', Jar) {
    archiveClassifier = 'javadoc'
}

android {
    namespace 'io.github.vserghei.pcl'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        minSdk 29
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    publishing {
        singleVariant('debug')
        singleVariant('release') {
            withSourcesJar()
        }
    }

    buildFeatures {
        prefabPublishing true
    }

    prefab {
        pclibrary {
            headers "${buildDir}/generated/prefabHeaders"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

preBuild.dependsOn extractArchives
preBuild.dependsOn preparePrefabHeaders

tasks.matching { it.name.startsWith("generatePrefab") || it.name.startsWith("package") }.configureEach {
    dependsOn preparePrefabHeaders
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/V-Serghei/pcl-binaries-android-armv8")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
        maven {
            name = "MavenCentralBundle"
            url = layout.buildDirectory.dir("mavenCentralStaging").get().asFile.toURI()
        }
    }
    publications {
        release(MavenPublication) {
            groupId = project.findProperty("GROUP")
            artifactId = project.findProperty("POM_ARTIFACT_ID")
            version = project.findProperty("VERSION_NAME")
            artifact(tasks.named('emptyJavadocJar'))

            pom {
                name = project.findProperty("POM_NAME")
                description = project.findProperty("POM_DESCRIPTION")
                url = project.findProperty("POM_URL")
                licenses {
                    license {
                        name = "BSD-3-Clause"
                        url = "https://opensource.org/license/bsd-3-clause"
                    }
                }
                developers {
                    developer {
                        id = "V-Serghei"
                        name = "V-Serghei"
                    }
                }
                scm {
                    connection = "scm:git:https://github.com/V-Serghei/pcl-binaries-android-armv8.git"
                    developerConnection = "scm:git:ssh://git@github.com/V-Serghei/pcl-binaries-android-armv8.git"
                    url = "https://github.com/V-Serghei/pcl-binaries-android-armv8"
                }
            }
        }
    }
}

afterEvaluate {
    publishing.publications.named("release", MavenPublication) {
        from components.release
    }
}

signing {
    def signingKey = project.findProperty("signingInMemoryKey") ?: System.getenv("SIGNING_KEY")
    def signingKeyFile = project.findProperty("signingInMemoryKeyFile") ?: System.getenv("SIGNING_KEY_FILE")
    def signingPassword = project.findProperty("signingInMemoryKeyPassword") ?: System.getenv("SIGNING_PASSWORD")

    if (!signingKey && signingKeyFile) {
        signingKey = file(signingKeyFile).text
    }

    required {
        gradle.taskGraph.hasTask(":pclibrary:mavenCentralBundle") ||
                gradle.taskGraph.hasTask(":pclibrary:publishReleasePublicationToMavenCentralBundleRepository")
    }

    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }

    sign publishing.publications.release
}

tasks.register('mavenCentralBundle', Zip) {
    group = "publishing"
    description = "Builds a signed Maven Central deployment bundle for manual upload in Central Portal."
    dependsOn tasks.named('publishReleasePublicationToMavenCentralBundleRepository')

    archiveFileName = "${project.findProperty("POM_ARTIFACT_ID")}-${project.findProperty("VERSION_NAME")}-maven-central-bundle.zip"
    destinationDirectory = layout.buildDirectory.dir("distributions")
    from(layout.buildDirectory.dir("mavenCentralStaging"))

    doFirst {
        def signingKey = project.findProperty("signingInMemoryKey") ?: System.getenv("SIGNING_KEY")
        def signingKeyFile = project.findProperty("signingInMemoryKeyFile") ?: System.getenv("SIGNING_KEY_FILE")
        if (!signingKey) {
            signingKey = signingKeyFile ? file(signingKeyFile).text : null
        }
        if (!signingKey) {
            throw new GradleException("Maven Central requires signed artifacts. Add signingInMemoryKeyFile and signingInMemoryKeyPassword to ~/.gradle/gradle.properties or set SIGNING_KEY_FILE and SIGNING_PASSWORD.")
        }
    }

    doLast {
        def bundleFile = archiveFile.get().asFile
        println "Maven Central bundle created: ${bundleFile.absolutePath}"
    }
}


dependencies {
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
